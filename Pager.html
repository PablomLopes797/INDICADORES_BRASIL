<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TRIZY · Painel do Motorista</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script>try{if((localStorage.getItem('trizy_tema')||'dark')==='light')document.documentElement.classList.add('pre-light');}catch(e){}</script>
<style>
/* ==================================================================
   TRIZY · DESIGN SYSTEM (base compartilhada)
   Mesma linguagem visual da "Central de Recepção"
   ================================================================== */
:root{
  --cyan:#22d3ee; --violet:#8b5cf6; --pink:#ec4899;
  --green:#10b981; --amber:#f59e0b; --red:#ef4444;
  --ease:cubic-bezier(.2,.8,.2,1);
  --grad:linear-gradient(120deg,var(--cyan),var(--violet) 55%,var(--pink));
  --grad-soft:linear-gradient(160deg,var(--glass-strong),var(--glass));

  /* ---- tema escuro (padrão) ---- */
  --bg-1:#04050c; --bg-2:#0a0e1f;
  --txt:#e9edfa; --txt-2:#b9c1d9; --muted:#8891ad; --muted-2:#5c6580;
  --stroke:rgba(255,255,255,.10); --stroke-strong:rgba(255,255,255,.18);
  --glass:rgba(255,255,255,.045); --glass-strong:rgba(255,255,255,.08);
  --input-bg:rgba(0,0,0,.35);
  --input-ro-bg:rgba(139,92,246,.09); --input-ro-border:rgba(139,92,246,.28);
  --table-head:#12142a; --table-border:rgba(255,255,255,.05); --table-hover:rgba(139,92,246,.09);
  --shadow:0 26px 60px -22px rgba(0,0,0,.85);
  --grid-1:rgba(139,92,246,.10); --grid-2:rgba(34,211,238,.08);
  --orb-op:.42; --scroll:rgba(139,92,246,.4); --scroll-h:rgba(139,92,246,.7);
  --modal-backdrop:rgba(4,5,12,.75);
  --cyan-bg:rgba(34,211,238,.12); --cyan-bd:rgba(34,211,238,.32); --cyan-tx:#67e8f9;
  --violet-bg:rgba(139,92,246,.12); --violet-bd:rgba(139,92,246,.32); --violet-tx:#c4b5fd;
  --pink-bg:rgba(236,72,153,.12); --pink-bd:rgba(236,72,153,.32); --pink-tx:#f9a8d4;
  --ok-bg:rgba(16,185,129,.12); --ok-bd:rgba(16,185,129,.32); --ok-tx:#5eead4;
  --warn-bg:rgba(245,158,11,.12); --warn-bd:rgba(245,158,11,.32); --warn-tx:#fcd34d;
  --err-bg:rgba(239,68,68,.12); --err-bd:rgba(239,68,68,.32); --err-tx:#fca5a5;
}
body.light,html.pre-light body{
  --bg-1:#eef1f8; --bg-2:#f8fafc;
  --txt:#0f172a; --txt-2:#334155; --muted:#64748b; --muted-2:#94a3b8;
  --stroke:rgba(15,23,42,.10); --stroke-strong:rgba(15,23,42,.18);
  --glass:rgba(255,255,255,.70); --glass-strong:rgba(255,255,255,.90);
  --input-bg:rgba(255,255,255,.95);
  --input-ro-bg:rgba(139,92,246,.06); --input-ro-border:rgba(139,92,246,.22);
  --table-head:#f1f5f9; --table-border:rgba(15,23,42,.06); --table-hover:rgba(139,92,246,.06);
  --shadow:0 20px 50px -20px rgba(15,23,42,.18);
  --grid-1:rgba(139,92,246,.15); --grid-2:rgba(34,211,238,.12);
  --orb-op:.28; --scroll:rgba(139,92,246,.35); --scroll-h:rgba(139,92,246,.6);
  --modal-backdrop:rgba(15,23,42,.35);
  --cyan-tx:#0e7490; --violet-tx:#6d28d9; --pink-tx:#be185d;
  --ok-tx:#047857; --warn-tx:#b45309; --err-tx:#b91c1c;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(ellipse at 50% -20%,var(--bg-2),var(--bg-1) 60%);
  color:var(--txt);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;
  transition:background .5s var(--ease),color .35s var(--ease);
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}

/* ---------- fundo animado ---------- */
.grid-bg{
  position:fixed;inset:-20% -20% 0 -20%;z-index:0;pointer-events:none;
  background-image:linear-gradient(var(--grid-1) 1px,transparent 1px),linear-gradient(90deg,var(--grid-2) 1px,transparent 1px);
  background-size:56px 56px;
  transform:perspective(700px) rotateX(58deg) translateY(-6%) scale(2.2);
  transform-origin:top center;
  mask-image:radial-gradient(ellipse 70% 55% at 50% 0%,#000 0%,transparent 80%);
  -webkit-mask-image:radial-gradient(ellipse 70% 55% at 50% 0%,#000 0%,transparent 80%);
  animation:gridmove 6s linear infinite;
}
@keyframes gridmove{to{background-position:0 56px,56px 0}}
.orb{position:fixed;border-radius:50%;filter:blur(110px);opacity:var(--orb-op);pointer-events:none;z-index:0}
.o1{width:520px;height:520px;background:#7c3aed;top:-160px;left:-120px;animation:float1 14s ease-in-out infinite}
.o2{width:460px;height:460px;background:#0891b2;top:20%;right:-160px;animation:float2 18s ease-in-out infinite}
.o3{width:420px;height:420px;background:#db2777;bottom:-180px;left:35%;opacity:.25;animation:float3 20s ease-in-out infinite}
@keyframes float1{50%{transform:translate(80px,60px) scale(1.15)}}
@keyframes float2{50%{transform:translate(-70px,90px) scale(1.1)}}
@keyframes float3{50%{transform:translate(60px,-70px) scale(1.2)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shine{to{background-position:200% center}}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.35;transform:scale(.8)}}
.spin{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin .7s linear infinite}

/* ---------- topbar ---------- */
.topbar{
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 32px;gap:16px;flex-wrap:wrap;
  background:var(--glass);border-bottom:1px solid var(--stroke);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
}
.brand{display:flex;align-items:center;gap:14px}
.brand-logo{
  width:40px;height:40px;border-radius:12px;flex:none;
  background:var(--grad);background-size:200% auto;
  display:grid;place-items:center;font-weight:900;font-size:18px;color:#fff;
  box-shadow:0 10px 28px -10px rgba(139,92,246,.9);
  animation:shine 5s linear infinite;
}
.brand-logo svg{width:21px;height:21px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brand-txt{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand-txt strong{font-size:15.5px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.brand-txt span{font-size:11.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:600;white-space:nowrap}

.top-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1 1 auto;justify-content:center}
.nav-btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 16px;border-radius:12px;
  font-size:13px;font-weight:700;letter-spacing:.01em;
  text-decoration:none;color:var(--txt);cursor:pointer;
  background:var(--glass-strong);border:1px solid var(--stroke);
  transition:all .25s var(--ease);white-space:nowrap;
  font-family:inherit;line-height:1;
}
.nav-btn .ico{font-size:15px;line-height:1;display:inline-block;transition:transform .3s var(--ease)}
.nav-btn:hover{
  background:rgba(139,92,246,.14);border-color:rgba(139,92,246,.45);
  transform:translateY(-2px);box-shadow:0 10px 22px -12px rgba(139,92,246,.7);
}
.nav-btn:hover .ico{transform:scale(1.15) rotate(-6deg)}
.nav-btn:active{transform:translateY(0)}
.nav-btn:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
.nav-btn.active{
  background:rgba(139,92,246,.18);border-color:rgba(139,92,246,.55);
  box-shadow:0 10px 22px -14px rgba(139,92,246,.9);
}

.top-actions{display:flex;align-items:center;gap:10px}
.theme-toggle{
  width:44px;height:44px;border-radius:13px;cursor:pointer;
  background:var(--glass-strong);border:1px solid var(--stroke);
  display:grid;place-items:center;color:var(--txt);
  transition:all .3s var(--ease);position:relative;overflow:hidden;flex:none;
}
.theme-toggle:hover{border-color:rgba(139,92,246,.5);transform:translateY(-2px)}
.theme-toggle svg{width:20px;height:20px;transition:transform .5s var(--ease),opacity .35s}
.theme-toggle .icon-sun{opacity:1;transform:rotate(0) scale(1)}
.theme-toggle .icon-moon{opacity:0;transform:rotate(90deg) scale(.4);position:absolute}
body.light .theme-toggle .icon-sun,html.pre-light .theme-toggle .icon-sun{opacity:0;transform:rotate(-90deg) scale(.4);position:absolute}
body.light .theme-toggle .icon-moon,html.pre-light .theme-toggle .icon-moon{opacity:1;transform:rotate(0) scale(1)}

/* ---------- botões ---------- */
.btn{
  border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:14px;
  padding:12px 22px;border-radius:12px;letter-spacing:.01em;
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  transition:all .28s var(--ease);position:relative;overflow:hidden;text-decoration:none;
  background:var(--glass-strong);border:1px solid var(--stroke);color:var(--txt);
}
.btn-primary{
  background:var(--grad);background-size:200% auto;color:#fff;border-color:transparent;
  box-shadow:0 12px 32px -12px rgba(139,92,246,.9),inset 0 1px 0 rgba(255,255,255,.25);
}
.btn-primary:hover:not(:disabled){background-position:100% center;transform:translateY(-2px)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{background:var(--glass-strong);border:1px solid var(--stroke);color:var(--txt)}
.btn-ghost:hover{background:rgba(139,92,246,.12);border-color:rgba(139,92,246,.4)}
.btn-danger{background:rgba(239,68,68,.14);border:1px solid rgba(239,68,68,.42);color:var(--err-tx)}
.btn-danger:hover{background:rgba(239,68,68,.24);color:#fff}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn:active{transform:translateY(0) scale(.99)}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn .spin{border-color:rgba(255,255,255,.25);border-top-color:#fff}

/* ---------- layout ---------- */
.app{position:relative;z-index:2;max-width:1280px;margin:0 auto;padding:44px 32px 100px}
.app.wide{max-width:1560px}
.app.full{max-width:1920px}
.hidden{display:none!important}

/* ---------- hero ---------- */
.hero{margin-bottom:38px;animation:rise .7s var(--ease) both;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.hero .pill{
  display:inline-flex;align-items:center;gap:8px;padding:7px 15px;border-radius:100px;
  background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.28);
  font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--cyan-tx);margin-bottom:16px;
}
.hero .pill .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green);animation:pulse 1.8s infinite}
.hero h1{font-size:clamp(1.9rem,4.2vw,2.9rem);font-weight:800;letter-spacing:-.035em;line-height:1.08;margin-bottom:10px}
.hero h1 .grad{
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
  background-size:200% auto;animation:shine 5s linear infinite;
}
.hero p{color:var(--muted);font-size:14.5px;max-width:660px;line-height:1.6}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:26px}
.stat{
  padding:20px 20px 18px;border-radius:18px;
  background:var(--grad-soft);
  border:1px solid var(--stroke);position:relative;overflow:hidden;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  transition:transform .35s var(--ease),border-color .3s;
  box-shadow:var(--shadow);
}
.stat:hover{transform:translateY(-5px) scale(1.02);border-color:rgba(139,92,246,.4)}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--c,var(--cyan));opacity:.9;box-shadow:0 0 18px var(--c,var(--cyan))}
.stat-v{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--c,var(--cyan))}
.stat-l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.11em;margin-top:7px;font-weight:700}

/* ---------- cards ---------- */
.card{
  background:var(--grad-soft);
  border:1px solid var(--stroke);border-radius:22px;padding:26px;
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  box-shadow:var(--shadow);transition:border-color .3s,transform .35s var(--ease);
  animation:rise .7s var(--ease) .1s both;
}
.card+.card,.card+.notice,.panel+.panel{margin-top:18px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.card-head h2{
  font-size:13px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);display:flex;align-items:center;gap:10px;
}
.card-head h2::before{
  content:'';width:3px;height:16px;border-radius:2px;
  background:linear-gradient(180deg,var(--cyan),var(--violet));
  box-shadow:0 0 12px rgba(139,92,246,.8);
}
.card-head .card-sub{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
.card-title{font-size:13px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px}
.card-title::before{content:'';width:3px;height:16px;border-radius:2px;background:linear-gradient(180deg,var(--cyan),var(--violet));box-shadow:0 0 12px rgba(139,92,246,.8)}

/* ---------- tabela padrão ---------- */
.tw{overflow:auto;max-height:560px;border-radius:16px;border:1px solid var(--stroke);background:rgba(0,0,0,.14)}
body.light .tw,html.pre-light .tw{background:rgba(255,255,255,.5)}
table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
th{
  position:sticky;top:0;z-index:2;background:var(--table-head);
  padding:14px 16px;text-align:left;font-weight:800;font-size:10.5px;
  text-transform:uppercase;letter-spacing:.1em;color:var(--muted);
  border-bottom:1px solid var(--stroke);
}
td{padding:13px 16px;border-bottom:1px solid var(--table-border);color:var(--txt);font-variant-numeric:tabular-nums}
tbody tr{transition:background .2s}
tbody tr:hover td{background:var(--table-hover)}
tbody tr:last-child td{border-bottom:none}

/* ---------- badges ---------- */
.badge{
  display:inline-flex;align-items:center;gap:6px;padding:4px 11px;
  border-radius:8px;font-weight:700;font-size:11.5px;border:1px solid;letter-spacing:.02em;
  background:var(--violet-bg);border-color:var(--violet-bd);color:var(--violet-tx);
}
.badge-senha{background:var(--cyan-bg);border-color:var(--cyan-bd);color:var(--cyan-tx)}
.badge-cat{background:var(--violet-bg);border-color:var(--violet-bd);color:var(--violet-tx)}
.badge-placa{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok-tx);font-family:'SFMono-Regular',Consolas,monospace;font-weight:800}
.badge-ok{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok-tx)}
.badge-warn{background:var(--warn-bg);border-color:var(--warn-bd);color:var(--warn-tx)}
.badge-err{background:var(--err-bg);border-color:var(--err-bd);color:var(--err-tx)}

/* ---------- estados vazios ---------- */
.empty{text-align:center;padding:60px 24px;color:var(--muted);font-size:13px}
.empty-ico{font-size:52px;margin-bottom:14px;opacity:.5}
.empty-t{font-size:15px;font-weight:600;color:var(--muted);margin-bottom:6px}
.empty-s{font-size:13px;color:var(--muted-2)}

/* ---------- campos ---------- */
.field{position:relative;display:flex;flex-direction:column}
.field label,.filter-label{
  display:block;font-size:11px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;
}
.field label .req{color:var(--pink)}
.field input,.field select,.field textarea,.filter input,.filter select{
  width:100%;padding:13px 15px;border-radius:12px;font-family:inherit;
  font-size:14.5px;font-weight:500;background:var(--input-bg);
  border:1px solid var(--stroke);color:var(--txt);outline:none;
  transition:all .25s var(--ease);
}
.field input::placeholder,.filter input::placeholder{color:var(--muted-2);font-weight:400}
.field input:focus,.field select:focus,.field textarea:focus,.filter input:focus,.filter select:focus{
  border-color:var(--cyan);box-shadow:0 0 0 4px rgba(34,211,238,.14);background:var(--glass-strong);
}
.field select option,.filter select option{background:var(--bg-2);color:var(--txt)}
.field input[readonly],.field input:disabled,.field select:disabled{
  background:var(--input-ro-bg);border-color:var(--input-ro-border);
  color:var(--txt);cursor:not-allowed;font-weight:600;
}
.field small,.field .hint{font-size:11px;color:var(--muted-2);line-height:1.45;margin-top:7px}
.form-state{margin-right:auto;color:var(--muted);font-size:12px}
.form-actions{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:20px;flex-wrap:wrap}
.fgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.fgrid .field{grid-column:span 6}
.fgrid .field.half{grid-column:span 3}
.fgrid .field.third{grid-column:span 2}
.section-lbl{
  grid-column:span 6;font-size:11px;font-weight:800;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted-2);
  margin:8px 0 -4px;display:flex;align-items:center;gap:10px;
}
.section-lbl::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--stroke),transparent)}

/* ---------- modal ---------- */
.modal-overlay{
  position:fixed;inset:0;z-index:500;
  background:var(--modal-backdrop);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  display:grid;place-items:center;padding:24px;
  opacity:0;pointer-events:none;transition:opacity .35s var(--ease);
}
.modal-overlay.open,.modal-overlay:not(.hidden){opacity:1;pointer-events:auto}
.modal-overlay.hidden{opacity:0;pointer-events:none;display:grid}
.modal{
  width:100%;max-width:780px;max-height:92vh;overflow-y:auto;
  background:linear-gradient(165deg,var(--glass-strong),var(--glass));
  border:1px solid var(--stroke-strong);border-radius:26px;
  backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
  box-shadow:0 40px 100px -20px rgba(0,0,0,.7),0 0 80px -30px rgba(139,92,246,.5);
  transform:scale(.94) translateY(28px);opacity:0;
  transition:transform .45s var(--ease),opacity .35s var(--ease);
  padding:0;
}
.modal-overlay.open .modal,.modal-overlay:not(.hidden) .modal{transform:scale(1) translateY(0);opacity:1}
.modal-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
  padding:26px 28px 22px;border-bottom:1px solid var(--stroke);
}
.modal-head h3,.modal-title{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px;display:flex;align-items:center;gap:11px}
.modal-head h3 .mh-ico,.mh-ico{
  width:38px;height:38px;border-radius:11px;flex:none;
  background:var(--grad);background-size:200% auto;display:grid;place-items:center;font-size:19px;color:#fff;
  box-shadow:0 10px 26px -10px rgba(139,92,246,.9);animation:shine 5s linear infinite;
}
.modal-head p,.modal-sub{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.5}
.modal-body{padding:26px 28px}
.modal-foot,.modal-actions{display:flex;gap:12px;justify-content:flex-end;align-items:center;padding:20px 28px 24px;border-top:1px solid var(--stroke);flex-wrap:wrap}
.modal-actions .form-state{margin-right:auto}
.close-x,.modal-close,.x-btn{
  width:38px;height:38px;border-radius:11px;border:1px solid var(--stroke);
  background:var(--glass-strong);color:var(--txt);cursor:pointer;
  display:grid;place-items:center;font-size:20px;line-height:1;flex:none;
  transition:all .25s var(--ease);font-family:inherit;
}
.close-x:hover,.modal-close:hover,.x-btn:hover{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.4);color:var(--err-tx);transform:rotate(90deg)}

/* ---------- overlay de carregamento (cubo) ---------- */
.overlay{
  position:fixed;inset:0;z-index:900;
  background:var(--modal-backdrop);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .3s;
}
.overlay.open{opacity:1;pointer-events:auto}
.load-box{text-align:center;padding:0 24px}
.cube-wrap{perspective:900px;height:120px;display:grid;place-items:center;margin-bottom:22px}
.cube{width:66px;height:66px;position:relative;transform-style:preserve-3d;animation:spinCube 3s infinite linear}
@keyframes spinCube{0%{transform:rotateX(-22deg) rotateY(0)}100%{transform:rotateX(-22deg) rotateY(360deg)}}
.cube i{
  position:absolute;width:66px;height:66px;border-radius:8px;
  border:2px solid rgba(34,211,238,.55);
  background:linear-gradient(135deg,rgba(34,211,238,.13),rgba(139,92,246,.13));
  box-shadow:inset 0 0 30px rgba(34,211,238,.3),0 0 22px rgba(139,92,246,.22);
}
.cube i:nth-child(1){transform:translateZ(33px)}
.cube i:nth-child(2){transform:rotateY(180deg) translateZ(33px)}
.cube i:nth-child(3){transform:rotateY(90deg) translateZ(33px)}
.cube i:nth-child(4){transform:rotateY(-90deg) translateZ(33px)}
.cube i:nth-child(5){transform:rotateX(90deg) translateZ(33px)}
.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(33px)}
.load-title{font-size:17px;font-weight:700;margin-bottom:6px;letter-spacing:-.01em}
.load-sub{font-size:13px;color:var(--muted)}

/* ---------- toast ---------- */
.toast{
  position:fixed;bottom:30px;left:50%;z-index:1000;
  transform:translateX(-50%) translateY(140px);
  padding:15px 26px;border-radius:14px;font-size:14px;font-weight:600;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  transition:transform .45s var(--ease);max-width:90vw;text-align:center;
  box-shadow:0 20px 50px -14px rgba(0,0,0,.6);
  display:flex;align-items:center;gap:10px;
  background:var(--violet-bg);border:1px solid var(--violet-bd);color:var(--violet-tx);
}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.ok{background:rgba(16,185,129,.2);border-color:rgba(16,185,129,.5);color:var(--ok-tx)}
.toast.err{background:rgba(239,68,68,.2);border-color:rgba(239,68,68,.5);color:var(--err-tx)}
.toast.warn{background:rgba(245,158,11,.2);border-color:rgba(245,158,11,.5);color:var(--warn-tx)}

/* ---------- avisos ---------- */
.notice{
  margin-top:18px;padding:14px 16px;border-radius:14px;font-size:13px;line-height:1.55;
  background:var(--glass-strong);border:1px solid var(--stroke);color:var(--muted);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
}
.notice.success{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok-tx)}
.notice.error{background:var(--err-bg);border-color:var(--err-bd);color:var(--err-tx)}
.notice.warn{background:var(--warn-bg);border-color:var(--warn-bd);color:var(--warn-tx)}

/* ---------- legenda ---------- */
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:18px;color:var(--muted);font-size:11.5px;font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block;flex:none}
.legend .green{background:var(--green);box-shadow:0 0 10px -1px var(--green)}
.legend .red{background:var(--red);box-shadow:0 0 10px -1px var(--red)}
.legend .gray{background:#6b7280;border:1px solid var(--amber)}
.legend .alert{background:#b22222;border:1px solid #ffcc00}

/* ---------- scrollbar ---------- */
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:100px}
::-webkit-scrollbar-thumb:hover{background:var(--scroll-h)}

/* ---------- responsivo ---------- */
@media(max-width:1100px){
  .top-nav{order:3;flex:1 1 100%;justify-content:flex-start;padding-top:4px}
}
@media(max-width:820px){
  .topbar{padding:14px 18px;gap:12px}
  .top-nav{gap:6px}
  .nav-btn{padding:9px 12px;font-size:12px}
  .nav-btn .lbl{display:none}
  .nav-btn .ico{font-size:16px}
  .app{padding:28px 16px 80px}
  .card{padding:20px 16px}
  .fgrid .field.half,.fgrid .field.third{grid-column:span 6}
  .modal-head{padding:22px 20px 18px}
  .modal-body{padding:22px 20px}
  .modal-foot,.modal-actions{padding:16px 20px 20px;flex-direction:column-reverse}
  .modal-foot .btn,.modal-actions .btn{width:100%}
  .hero h1{font-size:1.7rem}
  table{font-size:12px}
  th,td{padding:11px 12px}
}

/* ==================================================================
   TRIZY · PAINEL DO MOTORISTA — componentes específicos
   ================================================================== */
body{
  display:flex;align-items:center;justify-content:center;
  padding:20px;min-height:100vh;
}
.card{
  position:relative;z-index:2;
  background:linear-gradient(165deg,var(--glass-strong),var(--glass));
  border:1px solid var(--stroke-strong);border-radius:28px;
  backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
  box-shadow:0 40px 100px -24px rgba(0,0,0,.9),0 0 80px -30px rgba(139,92,246,.5);
  max-width:500px;width:100%;padding:34px 26px 30px;text-align:center;
  animation:rise .6s var(--ease) both;
}
.card::before{content:'';position:absolute;top:0;left:12%;right:12%;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--cyan),var(--violet),var(--pink),transparent);opacity:.95}

.pager-theme{
  position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:12px;cursor:pointer;
  background:var(--glass-strong);border:1px solid var(--stroke);color:var(--txt);
  display:grid;place-items:center;transition:all .3s var(--ease);overflow:hidden;
}
.pager-theme:hover{border-color:rgba(139,92,246,.5);transform:translateY(-2px)}
.pager-theme svg{width:18px;height:18px;transition:transform .5s var(--ease),opacity .35s}
.pager-theme .icon-sun{opacity:1;transform:rotate(0) scale(1)}
.pager-theme .icon-moon{opacity:0;position:absolute;transform:rotate(90deg) scale(.4)}
body.light .pager-theme .icon-sun,html.pre-light .pager-theme .icon-sun{opacity:0;position:absolute;transform:rotate(-90deg) scale(.4)}
body.light .pager-theme .icon-moon,html.pre-light .pager-theme .icon-moon{opacity:1;transform:rotate(0) scale(1)}

.brand-row{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:20px}
.brand-logo{
  width:42px;height:42px;border-radius:13px;flex:none;display:grid;place-items:center;
  background:var(--grad);background-size:200% auto;color:#fff;font-weight:900;font-size:19px;
  box-shadow:0 12px 30px -12px rgba(139,92,246,.95);animation:shine 5s linear infinite;
}
.brand-txt{display:flex;flex-direction:column;line-height:1.15;text-align:left}
.brand-txt strong{font-size:15px;font-weight:800;letter-spacing:-.01em}
.brand-txt span{font-size:11px;color:var(--muted);letter-spacing:.09em;text-transform:uppercase;font-weight:700}

h1{font-size:clamp(1.7rem,6vw,2rem);font-weight:800;letter-spacing:-.035em;line-height:1.1;margin-bottom:8px}
h1 .grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% auto;animation:shine 5s linear infinite}
.sub{font-size:13.5px;color:var(--muted);margin-bottom:26px;line-height:1.5}

.campo-senha{display:flex;flex-direction:column;gap:12px;margin-bottom:24px}
.campo-senha input{
  height:58px;border-radius:14px;padding:0 18px;font-size:18px;font-weight:700;
  letter-spacing:.06em;background:var(--input-bg);border:1px solid var(--stroke);
  color:var(--txt);outline:none;width:100%;-webkit-appearance:none;text-align:center;
  transition:all .25s var(--ease);
}
.campo-senha input::placeholder{color:var(--muted-2);font-weight:500;letter-spacing:.02em}
.campo-senha input:focus{border-color:var(--cyan);box-shadow:0 0 0 4px rgba(34,211,238,.14);background:var(--glass-strong)}
.campo-senha button{
  height:58px;padding:0 24px;border-radius:14px;border:none;color:#fff;
  background:var(--grad);background-size:200% auto;
  font-weight:800;font-size:17px;letter-spacing:.02em;cursor:pointer;white-space:nowrap;
  box-shadow:0 16px 36px -14px rgba(139,92,246,.95),inset 0 1px 0 rgba(255,255,255,.25);
  transition:transform .18s var(--ease),background-position .4s var(--ease),opacity .18s;
  width:100%;-webkit-tap-highlight-color:transparent;
}
.campo-senha button:hover{background-position:100% center;transform:translateY(-2px)}
.campo-senha button:active{transform:scale(.98)}
.campo-senha button:disabled{opacity:.6;cursor:not-allowed;transform:none}

.status-area{
  min-height:168px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border-radius:20px;background:var(--glass);border:1px solid var(--stroke);
  padding:26px 18px;transition:background .35s var(--ease),border-color .35s var(--ease);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
}
.status-area .mensagem{font-size:15.5px;color:var(--muted);line-height:1.6;width:100%;font-weight:600}
.status-area .horario{font-size:12.5px;color:var(--muted-2);margin-top:10px;font-variant-numeric:tabular-nums}
.status-area .destaque{font-size:clamp(1.8rem,7vw,2.3rem);font-weight:900;letter-spacing:.03em;margin:6px 0 10px;line-height:1.1}
.status-area .destaque.acionado{color:var(--ok-tx);animation:pulse 1.4s ease-in-out infinite}
.status-area .destaque.aguardando{color:var(--warn-tx)}
.status-area .destaque.erro{color:var(--err-tx)}
.status-area .frase-acionamento{
  font-size:17px;font-weight:800;color:var(--ok-tx);
  background:var(--ok-bg);border:1px solid var(--ok-bd);
  padding:12px 20px;border-radius:100px;margin-top:10px;line-height:1.4;
}

.badge-refresh{
  margin-top:20px;font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.04em;
  display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
}
.badge-refresh .led{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--muted-2)}
.badge-refresh .led.ativo{background:var(--cyan);box-shadow:0 0 12px var(--cyan);animation:pisca 1.2s steps(2) infinite}
@keyframes pisca{0%{opacity:1}50%{opacity:.2}100%{opacity:1}}

@media(max-width:420px){
  .card{padding:26px 16px 26px;border-radius:24px}
  .campo-senha input,.campo-senha button{height:52px;font-size:16px}
  .status-area{min-height:150px;padding:20px 14px}
  .status-area .frase-acionamento{font-size:15px;padding:10px 16px}
}
@media(max-width:360px){
  .status-area{min-height:134px;padding:16px 10px}
  .status-area .frase-acionamento{font-size:13.5px}
}
@media(max-height:620px) and (orientation:landscape){
  .card{padding:20px 22px;border-radius:22px}
  .brand-row{margin-bottom:12px}
  .sub{margin-bottom:16px}
  .status-area{min-height:118px;padding:16px}
  .campo-senha{flex-direction:row;gap:10px;margin-bottom:16px}
  .campo-senha input{flex:2}
  .campo-senha button{flex:1}
}

<body>

<div class="grid-bg"></div>
<div class="orb o1"></div>
<div class="orb o2"></div>
<div class="orb o3"></div>

<div class="card">
  <button class="pager-theme" id="btnTheme" title="Alternar tema" aria-label="Alternar tema">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
    </svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  </button>

  <div class="brand-row">
    <div class="brand-logo">T</div>
    <div class="brand-txt">
      <strong>TRIZY</strong>
      <span>Painel do Motorista</span>
    </div>
  </div>

  <h1>Painel do <span class="grad">Motorista</span></h1>
  <p class="sub">Informe sua senha para verificar o acionamento</p>

  <div class="campo-senha">
    <input type="text" id="inputSenha" placeholder="Digite sua senha" autocomplete="off" inputmode="text" />
    <button id="btnConsultar">Consultar</button>
  </div>

  <div class="status-area" id="statusArea">
    <div class="mensagem" id="mensagemStatus">Aguardando consulta...</div>
    <div class="horario" id="horarioStatus"></div>
  </div>

  <div class="badge-refresh">
    <span class="led" id="ledRefresh"></span>
    <span id="textoRefresh">Atualização automática a cada 60s</span>
  </div>
</div>

<audio id="somAlerta" preload="auto" crossorigin="anonymous">
  <source src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3" type="audio/mpeg">
  <source src="https://www.soundjay.com/misc/sounds/bell-ringing-05.ogg" type="audio/ogg">
</audio>

<script>
    (function () {
      'use strict';

      // ===== SUPABASE =====
      const SUPABASE_URL = 'https://jgtisruauiajjfoesvol.supabase.co';
      const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpndGlzcnVhdWlhampmb2Vzdm9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1OTY3NjYsImV4cCI6MjEwMzE3Mjc2Nn0.yiAsD6c06UEauyAUCFYs0KQnuWBVfLAeP_oYE8yGOwQ';

      const TABELA = 'CADASTRO_ENTREGADOR';
      const COL_SENHA = 'SENHA';
      const COL_ACIONAMENTO = 'ACIONAMENTO PORTARIA';
      const COL_VISUALIZACAO = 'VISUALIZAÇÃO';

      const BASE_URL = `${SUPABASE_URL}/rest/v1/${encodeURIComponent(TABELA)}`;
      const HEADERS = {
        'apikey': SUPABASE_ANON,
        'Authorization': `Bearer ${SUPABASE_ANON}`
      };

      // ===== ELEMENTOS =====
      const inputSenha = document.getElementById('inputSenha');
      const btnConsultar = document.getElementById('btnConsultar');
      const mensagemStatus = document.getElementById('mensagemStatus');
      const horarioStatus = document.getElementById('horarioStatus');
      const statusArea = document.getElementById('statusArea');
      const ledRefresh = document.getElementById('ledRefresh');
      const textoRefresh = document.getElementById('textoRefresh');
      const somAlerta = document.getElementById('somAlerta');

      // ===== ESTADO =====
      let senhaAtual = '';
      let ultimoStatus = 'vazio';
      let intervaloId = null;
      let audioPronto = false;

      // ===== UTIL =====
      function escapeHtml(texto) {
        return String(texto).replace(/[&<>"']/g, c => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
      }

      function temValor(v) {
        return v !== null && v !== undefined && String(v).trim() !== '';
      }

      function dataHoraAgora() {
        const d = new Date();
        const p = n => String(n).padStart(2, '0');
        return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
      }

      // ===== ÁUDIO =====
      function prepararAudio() {
        if (audioPronto) return;
        somAlerta.load();
        somAlerta.play().then(() => {
          somAlerta.pause();
          somAlerta.currentTime = 0;
          audioPronto = true;
        }).catch(() => {});
      }

      function tocarAlerta() {
        if (!audioPronto) prepararAudio();
        somAlerta.currentTime = 0;
        somAlerta.play().catch(() => {
          try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const tocarBeep = (vezes) => {
              if (vezes === 0) { audioCtx.close().catch(() => {}); return; }
              const osc = audioCtx.createOscillator();
              const gain = audioCtx.createGain();
              osc.type = 'sine';
              osc.frequency.value = 880;
              gain.gain.value = 0.2;
              gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
              osc.connect(gain);
              gain.connect(audioCtx.destination);
              osc.start();
              osc.stop(audioCtx.currentTime + 0.15);
              setTimeout(() => tocarBeep(vezes - 1), 250);
            };
            tocarBeep(3);
          } catch (e) {}
        });
      }

      // ===== REGISTRAR VISUALIZAÇÃO (DD/MM/AAAA HH:MM) =====
      async function registrarVisualizacao(senha) {
        const dataHora = dataHoraAgora();
        const url = `${BASE_URL}?${COL_SENHA}=eq.${encodeURIComponent(senha)}`;
        const resp = await fetch(url, {
          method: 'PATCH',
          headers: { ...HEADERS, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
          body: JSON.stringify({ [COL_VISUALIZACAO]: dataHora })
        });
        if (!resp.ok) throw new Error('Erro ao registrar visualização: ' + resp.status);
        console.log('Visualização registrada em:', dataHora);
      }

      // ===== CONSULTA =====
      async function consultarSenha(senha) {
        const senhaLimpa = (senha || '').trim();
        if (!senhaLimpa) {
          atualizarStatus('vazio', 'Digite uma senha para consultar.');
          return;
        }

        btnConsultar.disabled = true;
        ledRefresh.className = 'led ativo';
        textoRefresh.textContent = 'Consultando...';

        try {
          const colunas = `${COL_SENHA},"${COL_ACIONAMENTO}","${COL_VISUALIZACAO}"`;
          const url = `${BASE_URL}?${COL_SENHA}=eq.${encodeURIComponent(senhaLimpa)}&select=${encodeURIComponent(colunas)}`;
          const resp = await fetch(url, { headers: HEADERS });
          if (!resp.ok) throw new Error('Erro na consulta: ' + resp.status);
          const data = await resp.json();

          if (!data || data.length === 0) {
            atualizarStatus('erro', 'Senha não encontrada.');
            return;
          }

          const registro = data[0];
          const acionamento = registro[COL_ACIONAMENTO];
          const visualizacao = registro[COL_VISUALIZACAO];

          if (temValor(acionamento)) {
            // Acionado: registra a visualização apenas na primeira vez
            if (!temValor(visualizacao)) {
              try {
                await registrarVisualizacao(senhaLimpa);
              } catch (err) {
                console.warn(err); // tentará de novo na próxima atualização
              }
            }
            atualizarStatus('acionado', String(acionamento).trim());
          } else {
            atualizarStatus('aguardando');
          }
        } catch (err) {
          console.error(err);
          atualizarStatus('erro', 'Erro ao consultar: ' + err.message);
        } finally {
          btnConsultar.disabled = false;
          ledRefresh.className = 'led';
          textoRefresh.textContent = 'Atualização automática a cada 60s';
        }
      }

      // ===== ATUALIZAR INTERFACE =====
      function atualizarStatus(novoStatus, texto) {
        const statusAnterior = ultimoStatus;
        ultimoStatus = novoStatus;
        statusArea.className = 'status-area';

        if (novoStatus === 'vazio') {
          mensagemStatus.textContent = texto || 'Aguardando consulta...';
          horarioStatus.textContent = '';
          statusArea.style.background = 'var(--glass)';
          statusArea.style.borderColor = 'var(--stroke)';
        } else if (novoStatus === 'aguardando') {
          mensagemStatus.innerHTML = `
            <div class="destaque aguardando">⏳ AGUARDANDO</div>
            <div style="font-size:15px; color:var(--muted);">Aguarde o acionamento.</div>
          `;
          horarioStatus.textContent = 'Última verificação: ' + new Date().toLocaleTimeString();
          statusArea.style.background = 'var(--warn-bg)';
          statusArea.style.borderColor = 'var(--warn-bd)';
        } else if (novoStatus === 'acionado') {
          mensagemStatus.innerHTML = `
            <div class="destaque acionado">✅ ACIONADO</div>
            <div class="frase-acionamento">Acionado, Dirija-se a portaria</div>
          `;
          horarioStatus.textContent = 'Acionamento registrado em: ' + (texto || 'horário não informado');
          statusArea.style.background = 'var(--ok-bg)';
          statusArea.style.borderColor = 'var(--ok-bd)';

          if (statusAnterior !== 'acionado' && statusAnterior !== 'vazio') {
            tocarAlerta();
          }
        } else if (novoStatus === 'erro') {
          mensagemStatus.innerHTML = `
            <div class="destaque erro">⚠️ ERRO</div>
            <div style="font-size:15px; color:var(--muted);">${escapeHtml(texto || 'Falha na consulta')}</div>
          `;
          horarioStatus.textContent = '';
          statusArea.style.background = 'var(--err-bg)';
          statusArea.style.borderColor = 'var(--err-bd)';
        }
      }

      // ===== AÇÃO CONSULTAR =====
      function realizarConsulta() {
        const senha = inputSenha.value.trim();
        if (senha) {
          senhaAtual = senha;
          consultarSenha(senha);
          if (!intervaloId) iniciarAutoRefresh();
        } else {
          atualizarStatus('vazio', 'Digite uma senha para consultar.');
        }
      }

      function iniciarAutoRefresh() {
        if (intervaloId) clearInterval(intervaloId);
        intervaloId = setInterval(() => {
          if (senhaAtual) consultarSenha(senhaAtual);
        }, 60000);
      }

      // ===== EVENTOS =====
      btnConsultar.addEventListener('click', function () {
        prepararAudio();
        realizarConsulta();
      });

      inputSenha.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          btnConsultar.click();
        }
      });

      inputSenha.addEventListener('input', function () {
        if (this.value.trim() === '') {
          if (intervaloId) { clearInterval(intervaloId); intervaloId = null; }
          senhaAtual = '';
          atualizarStatus('vazio', 'Aguardando consulta...');
        }
      });

      // ===== INICIALIZAÇÃO =====
      atualizarStatus('vazio', 'Digite sua senha e clique em Consultar');
      somAlerta.load();
    })();
  </script>
<script>
/* ===== TEMA CLARO / ESCURO (TRIZY) ===== */
(function(){
  var KEY = 'trizy_tema';
  var btn = document.getElementById('btnTheme');
  if(!btn) return;
  var atual = 'dark';
  try { atual = localStorage.getItem(KEY) || 'dark'; } catch(e){}
  document.documentElement.classList.remove('pre-light');
  document.body.classList.toggle('light', atual === 'light');
  btn.addEventListener('click', function(){
    var claro = document.body.classList.toggle('light');
    try { localStorage.setItem(KEY, claro ? 'light' : 'dark'); } catch(e){}
  });
})();
</script>
</body>
</html>
