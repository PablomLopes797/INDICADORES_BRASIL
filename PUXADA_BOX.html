<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#060914">
  <title>Validação de docas</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, -apple-system, sans-serif;

      --fundo: #060914;
      --texto: #eff8ff;
      --suave: #a2b6cd;
      --neon: #42e8ff;
      --roxo: #9875ff;
      --verde: #43ffac;
      --vermelho: #ff5078;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--fundo);
    }

    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--fundo);
      color: var(--texto);
      isolation: isolate;
      transition: background-color 350ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    button,
    input {
      font: inherit;
    }

    button {
      touch-action: manipulation;
    }

    [hidden] {
      display: none !important;
    }

    /* Ambiente luminoso */
    .ambiente {
      position: fixed;
      inset: 0;
      z-index: -2;
      overflow: hidden;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse at 10% 10%,
          #42e8ff10,
          transparent 48%
        ),
        radial-gradient(
          ellipse at 90% 70%,
          #9875ff14,
          transparent 48%
        );
    }

    .orbita {
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      filter: blur(65px);
      opacity: 0.15;
      animation: flutuar 14s ease-in-out infinite alternate;
    }

    .orbita.um {
      top: -100px;
      left: -100px;
      background: var(--neon);
    }

    .orbita.dois {
      right: -140px;
      bottom: 5%;
      background: var(--roxo);
      animation-delay: -7s;
    }

    .grelha {
      position: absolute;
      inset: 35% -100% -65%;
      background-image:
        linear-gradient(#42e8ff12 1px, transparent 1px),
        linear-gradient(90deg, #42e8ff12 1px, transparent 1px);
      background-size: 52px 52px;
      transform: perspective(500px) rotateX(58deg);
      transform-origin: center top;
      -webkit-mask-image:
        linear-gradient(transparent, #000 25%, transparent 80%);
      mask-image:
        linear-gradient(transparent, #000 25%, transparent 80%);
    }

    /* Feedback de ecrã inteiro */
    .feedback {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: 0;
      transition: opacity 300ms ease;
    }

    body.correto {
      background-color: #05291e;
      --neon: var(--verde);
    }

    body.incorreto {
      background-color: #340d1b;
      --neon: var(--vermelho);
    }

    body.correto .feedback {
      opacity: 1;
      background:
        radial-gradient(ellipse at center, #43ffac20, transparent 70%);
      box-shadow: inset 0 0 100px #43ffac25;
    }

    body.incorreto .feedback {
      opacity: 1;
      background:
        radial-gradient(ellipse at center, #ff507820, transparent 70%);
      box-shadow: inset 0 0 100px #ff507825;
    }

    .aplicacao {
      width: 100%;
      max-width: 500px;
      min-height: 100dvh;
      margin: 0 auto;
      padding:
        max(22px, env(safe-area-inset-top))
        20px
        max(24px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 18px;
      perspective: 1100px;
    }

    header {
      padding: 6px 0 2px;
      text-align: center;
      animation: entrar 650ms ease both;
    }

    .emblema {
      position: relative;
      display: grid;
      place-items: center;
      width: 66px;
      height: 66px;
      margin: 0 auto 18px;
      border: 1px solid #42e8ff55;
      border-radius: 20px;
      background: linear-gradient(145deg, #153248, #0a101f);
      color: var(--neon);
      box-shadow:
        0 0 25px #42e8ff1a,
        inset 0 1px 0 #ffffff26,
        0 9px 0 #02061280;
      transform: rotate(-8deg);
      animation: emblema 5s ease-in-out infinite;
    }

    .emblema svg {
      width: 34px;
      height: 34px;
      filter: drop-shadow(0 0 6px #42e8ff77);
    }

    h1 {
      margin: 0;
      font-size: clamp(25px, 7vw, 32px);
      letter-spacing: -1px;
      line-height: 1.15;
    }

    h1 span {
      color: var(--neon);
      text-shadow: 0 0 22px #42e8ff45;
    }

    header p {
      margin: 10px 0 0;
      color: var(--suave);
      font-size: 14px;
      line-height: 1.5;
    }

    .selo {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      padding: 6px 11px;
      border: 1px solid #ffffff12;
      border-radius: 999px;
      background: #ffffff04;
      color: #b8cadc;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .ponto {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--neon);
      box-shadow: 0 0 9px var(--neon);
    }

    /* Cartões com profundidade */
    .painel {
      position: relative;
      padding: 21px;
      border: 1px solid #7396bb30;
      border-radius: 24px;
      background:
        linear-gradient(145deg, #162238e8, #0a1121f5);
      box-shadow:
        0 18px 40px #00000045,
        0 5px 0 #02050d66,
        inset 0 1px 0 #ffffff12;
      transform-style: preserve-3d;
      animation: entrar 550ms ease both;
      transition:
        transform 250ms ease,
        border-color 250ms ease,
        box-shadow 250ms ease;
    }

    .painel::before {
      content: "";
      position: absolute;
      top: -1px;
      left: 22%;
      right: 22%;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        var(--neon),
        transparent
      );
      box-shadow: 0 0 14px #42e8ff55;
      pointer-events: none;
    }

    @media (hover: hover) and (pointer: fine) {
      .painel:hover {
        transform: translateY(-3px) rotateX(2deg);
        border-color: #42e8ff55;
        box-shadow:
          0 22px 45px #00000050,
          0 0 25px #42e8ff08,
          inset 0 1px 0 #ffffff16;
      }
    }

    .painel:focus-within {
      border-color: #42e8ff66;
    }

    .passo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .passo-numero {
      display: grid;
      place-items: center;
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border: 1px solid #42e8ff40;
      border-radius: 9px;
      background: #42e8ff0d;
      color: var(--neon);
      font-size: 12px;
      font-weight: 800;
    }

    label {
      font-size: 14px;
      font-weight: 700;
    }

    .campo {
      position: relative;
    }

    .campo svg {
      position: absolute;
      top: 50%;
      left: 15px;
      width: 21px;
      height: 21px;
      color: #708eaa;
      transform: translateY(-50%);
      pointer-events: none;
    }

    input {
      width: 100%;
      min-width: 0;
      min-height: 58px;
      padding: 14px 14px 14px 47px;
      border: 1px solid #7895ba40;
      border-radius: 14px;
      outline: none;
      background: #040a16c9;
      color: #fff;
      font-size: 18px;
      font-variant-numeric: tabular-nums;
      box-shadow: inset 0 3px 10px #00000030;
      transition:
        border-color 200ms ease,
        box-shadow 200ms ease;
    }

    input::placeholder {
      color: #647a95;
      opacity: 1;
    }

    input:focus {
      border-color: var(--neon);
      box-shadow:
        0 0 0 3px #42e8ff12,
        0 0 20px #42e8ff0d;
    }

    input:disabled {
      opacity: 0.55;
    }

    button {
      width: 100%;
      min-height: 54px;
      padding: 13px 16px;
      border: 0;
      border-radius: 14px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 800;
      transition:
        transform 180ms ease,
        box-shadow 180ms ease,
        opacity 180ms ease;
    }

    .principal {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 13px;
      overflow: hidden;
      background: linear-gradient(115deg, #42e8ff, #67b7ff);
      color: #041625;
      box-shadow:
        0 5px 0 #136080,
        0 9px 24px #42e8ff20,
        inset 0 1px 0 #ffffff77;
    }

    .principal::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        110deg,
        transparent 25%,
        #ffffff30 50%,
        transparent 75%
      );
      transform: translateX(-150%);
      animation: brilho 7s ease-in-out infinite;
      pointer-events: none;
    }

    .principal:not(:disabled):active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #136080;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    button:focus-visible {
      outline: 3px solid white;
      outline-offset: 5px;
    }

    .secundario {
      min-height: 48px;
      border: 1px solid #849cbc40;
      background: #111b2b99;
      color: #c5d5e7;
      font-size: 13px;
    }

    .secundario:hover {
      border-color: #849cbc80;
      background: #18263bcc;
    }

    .ajuda {
      margin: 15px 0 0;
      color: var(--suave);
      font-size: 12px;
      line-height: 1.6;
    }

    .ajuda strong {
      color: #dceaff;
      font-weight: 600;
    }

    /* Doca em destaque */
    .resultado {
      overflow: hidden;
      text-align: center;
      border-color: #42e8ff45;
      background:
        radial-gradient(ellipse at top, #42e8ff12, transparent 70%),
        linear-gradient(145deg, #14243a, #09111f);
    }

    .resultado::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(
        90deg,
        transparent,
        #42e8ff70,
        transparent
      );
      box-shadow: 0 0 16px #42e8ff45;
      animation: varrer 4s ease-in-out infinite;
      pointer-events: none;
    }

    .legenda {
      position: relative;
      margin: 0;
      color: #9cb5ce;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .doca {
      position: relative;
      margin: 8px 0 18px;
      color: var(--neon);
      font-size: clamp(56px, 17vw, 88px);
      line-height: 1.1;
      font-weight: 900;
      letter-spacing: -3px;
      overflow-wrap: anywhere;
      text-shadow:
        0 2px 0 #0d687a,
        0 4px 0 #084152,
        0 8px 16px #00000066,
        0 0 35px #42e8ff35;
      transform: translateZ(20px);
    }

    .separador {
      width: 60%;
      height: 1px;
      margin: 0 auto 16px;
      background: linear-gradient(
        90deg,
        transparent,
        #8ab5d940,
        transparent
      );
    }

    .carga {
      position: relative;
      margin: 7px 0 0;
      font-size: clamp(25px, 8vw, 34px);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: 2px;
      overflow-wrap: anywhere;
    }

    /* Mensagens */
    .estado-caixa {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 70px;
      padding: 15px;
      border: 1px solid #7895ba25;
      border-radius: 17px;
      background: #0c1423b3;
      transition:
        border-color 250ms ease,
        background 250ms ease;
    }

    .indicador {
      display: grid;
      place-items: center;
      flex-shrink: 0;
      width: 30px;
      height: 30px;
      border: 1px solid #42e8ff35;
      border-radius: 50%;
      color: var(--neon);
      background: #42e8ff08;
      font-size: 17px;
      font-weight: 800;
    }

    .estado {
      margin: 0;
      color: #c0d0e3;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    body.correto .estado-caixa {
      border-color: #43ffac66;
      background: #073522;
      box-shadow: 0 0 25px #43ffac15;
    }

    body.correto .estado {
      color: #baffdc;
    }

    body.incorreto .estado-caixa {
      border-color: #ff507866;
      background: #391323;
    }

    body.incorreto .estado {
      color: #ffd0dc;
    }

    .a-consultar .indicador {
      border-color: #42e8ff25;
      border-top-color: var(--neon);
      animation: girar 800ms linear infinite;
    }

    .a-consultar .indicador span {
      visibility: hidden;
    }

    .a-consultar .principal::after {
      animation-duration: 1.5s;
    }

    .abalo {
      animation: abanar 350ms ease;
    }

    .rodape {
      margin: auto 0 0;
      padding-top: 4px;
      color: #778ea7;
      text-align: center;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .rodar {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 20px;
      padding: 30px;
      background: #060914;
      text-align: center;
      font-size: 22px;
      font-weight: 800;
    }

    .telefone {
      width: 40px;
      height: 65px;
      border: 3px solid var(--neon);
      border-radius: 10px;
      box-shadow: 0 0 25px #42e8ff33;
      animation: orientar 2s ease-in-out infinite;
    }

    @keyframes entrar {
      from {
        opacity: 0;
        transform: translateY(18px) rotateX(-7deg);
      }
      to {
        opacity: 1;
        transform: translateY(0) rotateX(0);
      }
    }

    @keyframes flutuar {
      to {
        transform: translate(45px, 65px) scale(1.15);
      }
    }

    @keyframes emblema {
      0%, 100% {
        transform: translateY(0) rotate(-8deg);
      }
      50% {
        transform: translateY(-5px) rotate(3deg);
      }
    }

    @keyframes brilho {
      0%, 65% {
        transform: translateX(-150%);
      }
      90%, 100% {
        transform: translateX(150%);
      }
    }

    @keyframes varrer {
      0%, 100% {
        transform: translateY(0);
        opacity: 0;
      }
      15%, 70% {
        opacity: 0.7;
      }
      85% {
        transform: translateY(240px);
        opacity: 0;
      }
    }

    @keyframes girar {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes abanar {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-3px); }
    }

    @keyframes orientar {
      0%, 100% { transform: rotate(0); }
      50% { transform: rotate(-90deg); }
    }

    @media (max-width: 360px) {
      .aplicacao {
        padding-left: 13px;
        padding-right: 13px;
        gap: 14px;
      }

      .painel {
        padding: 17px;
      }
    }

    @media (orientation: landscape) and (hover: none) and (pointer: coarse) {
      .rodar {
        display: flex;
      }

      .aplicacao {
        visibility: hidden;
      }
    }

    /* Respeita quem prefere menos animações. */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }

      .painel:hover {
        transform: none;
      }
    }
  </style>
</head>

<body>
  <div class="ambiente" aria-hidden="true">
    <div class="orbita um"></div>
    <div class="orbita dois"></div>
    <div class="grelha"></div>
  </div>

  <div class="feedback" aria-hidden="true"></div>

  <div class="rodar" role="alert">
    <div class="telefone" aria-hidden="true"></div>
    <span>Roda o dispositivo para a posição vertical.</span>
  </div>
